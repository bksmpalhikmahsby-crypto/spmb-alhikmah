<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPMB SMP Al Hikmah Surabaya</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#f1f5f9}
input,select,textarea{font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:#1a56db!important;outline:none;box-shadow:0 0 0 3px rgba(26,86,219,.13)}
input[type=number]::-webkit-inner-spin-button{opacity:.5}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:fadeIn .25s ease}
.bp{background:#1a56db;color:#fff;border:none;border-radius:9px;padding:9px 18px;font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.bp:hover{background:#1e40af}
.bs{background:#fff;color:#374151;border:1.5px solid #d1d5db;border-radius:9px;padding:9px 14px;font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.bs:hover{background:#f8fafc}
.bg_{background:#059669;color:#fff;border:none;border-radius:9px;padding:9px 18px;font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.bg_:hover{background:#047857}
.bg_:disabled{background:#9ca3af;cursor:default}
.card{background:#fff;border:1.5px solid #e2e8f0;border-radius:16px;padding:20px 22px;margin-bottom:12px}
.inp{width:100%;padding:9px 12px;border-radius:8px;border:1.5px solid #e2e8f0;background:#fff;color:#111827;font-size:13px;font-family:inherit}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px 15px}
.full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:11px;font-weight:700;color:#475569;letter-spacing:.05em;text-transform:uppercase}
.hint{font-size:11px;color:#94a3b8;margin-top:2px}
.rrow{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #f1f5f9;font-size:12px}
.rl{color:#64748b;flex-shrink:0}.rv{font-weight:700;color:#1e293b;font-size:12px;text-align:right;max-width:60%}
.toast{padding:10px 14px;border-radius:10px;font-size:13px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.role-card{border:2px solid #e2e8f0;border-radius:12px;padding:14px 10px;cursor:pointer;text-align:center;transition:all .15s}
.role-card:hover{border-color:#1a56db;background:#eff6ff}
.rb{display:flex;align-items:center;min-height:40px;gap:8px;width:100%;padding:9px 12px;border-radius:8px;border:1.5px solid #e2e8f0;background:#f8fafc}
.sh{grid-column:1/-1;padding-top:10px;border-top:1.5px dashed #e2e8f0;margin-top:4px;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:999;display:flex;align-items:center;justify-content:center}
.modal-box{background:#fff;border-radius:16px;padding:28px 28px 22px;width:420px;max-width:95vw;box-shadow:0 20px 60px rgba(0,0,0,.25)}
@media print{
  @page{size:A4 landscape;margin:10mm}
  .np{display:none!important}
  body{background:#fff!important}
  .print-header{display:flex!important}
  table{font-size:9px!important}
  th,td{padding:4px 5px!important}
  .card{border:1px solid #ccc!important;padding:8px!important;margin-bottom:5px!important}
  .det-body{display:none!important}
  .modal-bg{display:none!important}
}
.print-header{display:none}
</style>
</head>

function calcPs(c,s2,s3,s5,s6,e,s,a){const lm=F.lm(s5,s6),tin=F.tin(s2,s3,s5,s6),pri=F.pri(e,s,a),psiko=F.psi(tin.sk,pri);return{cfitHasil:F.cfit(c),pemahaman:F.pem(s2),penalaran:F.pen(s3),logmatTotal:lm.val,logmatSkala:lm.lbl,tintumTotal:tin.tot,tintumLabel:tin.lbl,skalaKecerdasan:tin.sk,skalaPribadi:pri,skalaPsiko:psiko,rekomendasi:F.rek(psiko)};}

function getMerged(){
  const map={};
  /* Proses semua record - yang terakhir overwrite field yang tidak kosong */
  raw.forEach(r=>{
    const k=String(r.noPendaftaran||"").trim();
    if(!k)return;
    if(!map[k])map[k]={noPendaftaran:k};
    Object.keys(r).forEach(f=>{
      /* Selalu overwrite dengan nilai baru jika tidak kosong */
      if(r[f]!==undefined && r[f]!=="") map[k][f]=r[f];
    });
  });
  return Object.values(map);
}
function getFiltered(mg){let fl=[...mg];if(sq)fl=fl.filter(p=>(p.nama||"").toLowerCase().includes(sq.toLowerCase())||(p.noPendaftaran||"").toLowerCase().includes(sq.toLowerCase())||(p.sekolah||"").toLowerCase().includes(sq.toLowerCase()));fl.sort((a,b)=>{if(sb==="nama")return(a.nama||"").localeCompare(b.nama||"");if(sb==="psiko")return(+b.skalaPsiko||0)-(+a.skalaPsiko||0);if(sb==="akademis")return(+b.rataAkademis||0)-(+a.rataAkademis||0);if(sb==="quran")return(+b.totalQuran||0)-(+a.totalQuran||0);const na=+a.noPendaftaran,nb=+b.noPendaftaran;if(!isNaN(na)&&!isNaN(nb))return na-nb;return String(a.noPendaftaran).localeCompare(String(b.noPendaftaran));});return fl;}

  const eksternal=mg.filter(p=>p.status==="Eksternal").length;
  const ya=mg.filter(p=>p.rekomendasi==="YA").length;
  const tidak=mg.filter(p=>p.rekomendasi==="TIDAK").length;

  </tr>`).join("");

            <button onclick="saveInlineId('${p.noPendaftaran}')"
              style="background:#059669;color:#fff;border:none;border-radius:7px;padding:6px 0;font-size:11px;font-weight:700;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:5px">
              <i class="ti ti-device-floppy" style="font-size:12px"></i> Simpan Nama Panggilan & Tanggal Test
            </button>

        </div>
        <div><div style="font-size:10px;font-weight:800;color:#0891b2;text-transform:uppercase;margin-bottom:8px;padding-bottom:4px;border-bottom:1.5px solid #cffafe"><i class="ti ti-brain" style="margin-right:4px"></i>Psikotest</div>

          <div class="rrow"><span class="rl">Kap. Kecerdasan</span><span class="rv">${bdg(p.cfitHasil)}</span></div>

          <div class="rrow"><span class="rl">S3 Penalaran</span><span class="rv">${dv(p.s3)} → ${bdg(p.penalaran)}</span></div>
          <div class="rrow"><span class="rl">S5/S6 Logmat</span><span class="rv">${dv(p.s5)}/${dv(p.s6)}=${dv(p.logmatTotal)} (${dv(p.logmatSkala)})</span></div>
          <div class="rrow"><span class="rl">Total TINTUM</span><span class="rv">${dv(p.tintumTotal)} (${dv(p.tintumLabel)})</span></div>

          <div class="rrow"><span class="rl">E/S/A</span><span class="rv">${dv(p.emosi)}/${dv(p.sosial)}/${dv(p.adaptasi)}</span></div>

function openEdit(k){
  const mg=getMerged();
  const p=mg.find(x=>x.noPendaftaran===k);
  if(!p)return;
  editKey=k;
  /* Simpan role admin, ganti sementara ke panitia agar form identitas muncul */
  const prevRole=cu?cu.role:"admin";
  const prevName=cu?cu.name:"Admin";
  cu={role:"panitia",name:prevName,_prevRole:prevRole};
  render();
  /* Prefill setelah render - gunakan value assignment langsung (tanpa cek kosong) */
  setTimeout(()=>{
    const setVal=(id,v)=>{const e=document.getElementById(id);if(e){e.value=(v||"");}};
    setVal("I-nopend", p.noPendaftaran);
    setVal("I-nama",   p.nama||"");
    setVal("I-panggil",p.panggil||"");
    setVal("I-jk",     p.jk||"");
    setVal("I-tgl",    p.tgl||"");
    setVal("I-status", p.status||"");
    setVal("I-sekolah",p.sekolah||"");
    setVal("I-tahun",  p.tahun||"2025/2026");
    /* Lock no. pendaftaran */
    const nop=document.getElementById("I-nopend");
    if(nop){nop.readOnly=true;nop.style.background="#f1f5f9";nop.style.color="#64748b";}
    /* Banner edit mode */
    const app=document.getElementById("app");
    const div=document.createElement("div");
    div.id="edit-banner";
    div.style.cssText="background:#fef3c7;border:1.5px solid #f59e0b;border-radius:10px;padding:10px 14px;margin-bottom:10px;font-size:12px;color:#92400e;display:flex;align-items:center;justify-content:space-between;gap:8px";
    div.innerHTML=`<span><i class="ti ti-pencil" style="font-size:15px;margin-right:6px"></i><b>Mode Edit Identitas</b> — No.Pendaftaran <b>${k}</b>. Lengkapi Tanggal Test & Nama Panggilan lalu klik Simpan.</span>
      <button onclick="cancelEdit()" style="background:none;border:1px solid #f59e0b;color:#92400e;border-radius:6px;padding:3px 10px;font-size:11px;cursor:pointer;font-weight:700">✕ Batal</button>`;
    app.insertBefore(div, app.firstChild);
    window.scrollTo({top:0,behavior:"smooth"});
  },80);
}
function cancelEdit(){
  /* Kembalikan ke tampilan admin rekap */
  const prev=cu&&cu._prevRole?cu._prevRole:"admin";
  const nm=cu?cu.name:"Admin";
  cu={role:prev,name:nm};
  editKey=null;
  render();
}
function saveInlineId(key){
  const panggilEl = document.getElementById("ip-panggil-"+key);
  const tglEl     = document.getElementById("ip-tgl-"+key);
  if(!panggilEl || !tglEl){ showToast("Form tidak ditemukan!","error"); return; }

  const panggil = panggilEl.value.trim();
  const tgl     = tglEl.value;

  if(!panggil){ showToast("Nama Panggilan wajib diisi!","error"); panggilEl.focus(); return; }
  if(!tgl)    { showToast("Tanggal Test wajib diisi!","error"); tglEl.focus(); return; }

  const p = getMerged().find(x=>x.noPendaftaran===key);
  if(!p){ showToast("Data siswa tidak ditemukan!","error"); return; }

  const row={
    noPendaftaran: key,
    nama    : p.nama    ||"",
    status  : p.status  ||"",
    tahun   : p.tahun   ||"",
    tgl     : tgl,
    panggil : panggil,
    jk      : p.jk      ||"",
    sekolah : p.sekolah ||"",
    inputIdBy: cu?cu.name:"Admin",
    type    :"identitas"
  };
  raw.push(row);
  saveLocal();
  sendGS(row).catch(()=>{});
  od.add(key);
  showToast("✓ Nama Panggilan & Tanggal Test berhasil disimpan!","success");
  render();
}
function inlineEdit(key, field, curVal){
  const label = field==="tgl" ? "Tanggal Test" : "Nama Panggilan";
  const inputType = field==="tgl" ? "date" : "text";
  const placeholder = field==="tgl" ? "Pilih tanggal" : "Nama panggilan siswa";

  /* Buat modal kecil inline */
  const existing = document.getElementById("inline-modal");
  if(existing) existing.remove();

  const modal = document.createElement("div");
  modal.id = "inline-modal";
  modal.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:9999;display:flex;align-items:center;justify-content:center";
  modal.innerHTML = `
    <div style="background:#fff;border-radius:14px;padding:24px;width:320px;box-shadow:0 20px 60px rgba(0,0,0,.25)">
      <div style="font-size:14px;font-weight:800;color:#111827;margin-bottom:4px">
        <i class="ti ti-pencil" style="color:#059669;margin-right:6px"></i>Edit ${label}
      </div>
      <div style="font-size:11px;color:#64748b;margin-bottom:14px">No. Pendaftaran: <b>${key}</b></div>
      <input id="inline-input" type="${inputType}" value="${curVal}"
        placeholder="${placeholder}"
        style="width:100%;padding:9px 12px;border-radius:8px;border:1.5px solid #e2e8f0;font-size:13px;font-family:inherit;outline:none;box-sizing:border-box">
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
        <button id="inline-cancel" style="background:#fff;color:#374151;border:1.5px solid #d1d5db;border-radius:8px;padding:7px 14px;font-weight:600;font-size:12px;cursor:pointer">Batal</button>
        <button id="inline-save" style="background:#059669;color:#fff;border:none;border-radius:8px;padding:7px 18px;font-weight:700;font-size:12px;cursor:pointer">Simpan</button>
      </div>
    </div>`;
  document.body.appendChild(modal);

  /* Focus & select */
  const inp = document.getElementById("inline-input");
  if(inp){ inp.focus(); if(inputType==="text") inp.select(); }

  document.getElementById("inline-cancel").onclick = ()=>modal.remove();
  modal.onclick = e=>{ if(e.target===modal) modal.remove(); };

  document.getElementById("inline-save").onclick = async ()=>{
    const newVal = document.getElementById("inline-input").value.trim();
    if(!newVal){ modal.remove(); return; }

    /* Simpan sebagai record baru identitas dengan hanya field yang diubah */
    /* getMerged akan overwrite karena field tidak kosong */
    const p = getMerged().find(x=>x.noPendaftaran===key);
    if(!p){ modal.remove(); return; }

    const row = {
      noPendaftaran: key,
      nama: p.nama||"",
      status: p.status||"",
      tahun: p.tahun||"",
      tgl: field==="tgl" ? newVal : (p.tgl||""),
      panggil: field==="panggil" ? newVal : (p.panggil||""),
      jk: p.jk||"",
      sekolah: p.sekolah||"",
      inputIdBy: cu?cu.name:"Admin",
      type:"identitas"
    };
    raw.push(row);
    saveLocal();
    try{ await sendGS(row); }catch(e){}

    modal.remove();
    od.add(key); /* Tetap buka detail setelah simpan */
    showToast(`✓ ${label} berhasil diperbarui!`, "success");
    render();
  };
}
function render(){
  let h=hdr();
  if(toast){const toastMap={success:"#f0fdf4|#065f46|#6ee7b7|ti-circle-check",error:"#fef2f2|#991b1b|#fca5a5|ti-alert-circle",warn:"#fffbeb|#92400e|#fcd34d|ti-alert-triangle",info:"#eff6ff|#1e40af|#93c5fd|ti-info-circle"};const[bg,cl,br,ic]=(toastMap[toast.type]||toastMap.success).split("|");h+=`<div class="toast" style="background:${bg};color:${cl};border:1.5px solid ${br}"><i class="ti ${ic}" style="font-size:16px"></i>${toast.msg}</div>`;}
  if(!cu)h+=bLogin();
  else if(cu.role==="panitia")h+=bIdentitas();
  else if(cu.role==="psikotest")h+=bPsikotest();
  else if(cu.role==="akademis")h+=bAkademis();
  else if(cu.role==="alquran")h+=bAlQuran();
  else if(cu.role==="admin")h+=bRekap();
  h+=buildModal();
  $("app").innerHTML=h;
  bindAll();
}

function bindAll(){
  if($("B-logout"))$("B-logout").onclick=()=>{cu=null;lr=null;ln="";le="";pwShow=false;render()};
  document.querySelectorAll(".role-card").forEach(c=>c.onclick=()=>{lr=c.dataset.role;ln="";le="";pwShow=false;render()});
  if($("B-login"))$("B-login").onclick=doLogin;
  if($("L-pass"))$("L-pass").onkeydown=e=>{if(e.key==="Enter")doLogin()};
  if($("B-eye"))$("B-eye").onclick=function(e){e.preventDefault();e.stopPropagation();pwShow=!pwShow;const inp=$("L-pass");if(inp){const v=inp.value;inp.type=pwShow?"text":"password";inp.value=v;try{inp.focus();}catch(ex){}}this.innerHTML=pwShow?EYE_OFF:EYE_ON;};
  ["P-cfit","P-s2","P-s3","P-s5","P-s6","P-emosi","P-sosial","P-adaptasi"].forEach(id=>{if($(id))$(id).oninput=livePs});
  ["A-bindo","A-mat","A-ipa","A-bing"].forEach(id=>{if($(id))$(id).oninput=liveAk});
  ["Q-baca","Q-hafalan"].forEach(id=>{if($(id))$(id).oninput=liveAq});
  if($("B-saveId"))$("B-saveId").onclick=saveId;
  if($("B-savePs"))$("B-savePs").onclick=savePs;
  if($("B-saveAk"))$("B-saveAk").onclick=saveAk;
  if($("B-saveAq"))$("B-saveAq").onclick=saveAq;
  if($("B-search"))$("B-search").oninput=e=>{sq=e.target.value;render()};
  if($("B-sort"))$("B-sort").onchange=e=>{sb=e.target.value;render()};
  if($("B-print"))$("B-print").onclick=()=>{showModal="print";render()};
  if($("B-csv"))$("B-csv").onclick=()=>{showModal="csv";render()};
  if($("M-cancel"))$("M-cancel").onclick=()=>{showModal=false;render()};
  if($("modal-bg"))$("modal-bg").onclick=e=>{if(e.target===$("modal-bg")){showModal=false;render();}};

  if($("M-tgl"))$("M-tgl").oninput=e=>{modalTgl=e.target.value;if($("M-prev-tgl"))$("M-prev-tgl").textContent=modalTgl?`Tanggal Pelaksanaan: ${fmtTgl(modalTgl)}`:"Tanggal Pelaksanaan: —";};
  if($("M-ok"))$("M-ok").onclick=()=>{
    modalTahun=gv("M-tahun")||modalTahun;
    modalTgl=gv("M-tgl")||modalTgl;
    if(showModal==="print") doPrint();
    else if(showModal==="gsexcel") doCetakExcelDariSheets();
    else exportCSV();
    showModal=false;render();
  };
  document.querySelectorAll(".DT").forEach(b=>b.onclick=()=>{const k=b.dataset.key;od.has(k)?od.delete(k):od.add(k);render()});
  /* inline edit handled by saveInlineId() */
  document.querySelectorAll(".B-det").forEach(b=>b.onclick=()=>{const k=b.dataset.key;od.add(k);render();setTimeout(()=>{const d=document.querySelector(`.DT[data-key="${k}"]`);if(d)d.scrollIntoView({behavior:"smooth",block:"start"})},100)});
  document.querySelectorAll(".B-del").forEach(b=>b.onclick=e=>{e.stopPropagation();deleteSiswa(b.dataset.key);});
  if($("B-gsexcel"))$("B-gsexcel").onclick=()=>{showModal="gsexcel";render()};
  if($("B-import"))$("B-import").onclick=()=>{$("F-import").click();};
  if($("F-import"))$("F-import").onchange=doImportData;
}

function getIdentitasList(){
  // Ambil semua siswa dari identitas yang sudah diinput
  const merged=getMerged();
  return merged.filter(r=>r.nama&&r.nama!="").sort((a,b)=>{
    const na=Number(a.noPendaftaran)||0, nb=Number(b.noPendaftaran)||0;
    return na-nb;
  });
}
function buildDatalist(prefix){
  // Buat datalist options dari data identitas
  const list=getIdentitasList();
  return list.map(r=>`<option value="${r.noPendaftaran}">${r.noPendaftaran} — ${r.nama}</option>`).join('');
}

}

function doImportData(){
  const file=$("F-import").files[0];
  if(!file){return;}
  // Reset input agar bisa pilih file yang sama lagi
  $("F-import").value="";
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const csv=e.target.result;
      const lines=csv.trim().split("\n");
      if(lines.length<=1){showToast("File kosong atau tidak valid!","error");return;}
      // Skip header baris pertama
      let imported=0;
      for(let i=1;i<lines.length;i++){
        // Parse CSV dengan handle quotes
        const cols=[];
        let cur="",inQ=false;
        for(let c=0;c<lines[i].length;c++){
          const ch=lines[i][c];
          if(ch==='"'){inQ=!inQ;}
          else if(ch===','&&!inQ){cols.push(cur.trim().replace(/^"|"$/g,""));cur="";}
          else{cur+=ch;}
        }
        cols.push(cur.trim().replace(/^"|"$/g,""));
        const nop=String(cols[0]||"").trim();
        if(!nop||nop==="No. Pendaftaran"||nop==="0")continue;
        // Cek apakah noPendaftaran sudah ada di raw
        const existIdx=raw.findIndex(r=>String(r.noPendaftaran).trim()===nop);
        const row={
          noPendaftaran:nop, nama:cols[1]||"", panggil:cols[2]||"",
          jk:cols[3]||"", tgl:cols[4]||"", status:cols[5]||"",
          sekolah:cols[6]||"", tahun:cols[7]||"",
          cfit:cols[8]||"", cfitHasil:cols[9]||"",
          s2:cols[10]||"", s3:cols[11]||"", s5:cols[12]||"", s6:cols[13]||"",
          logmatTotal:cols[14]||"", logmatSkala:cols[15]||"",
          tintumTotal:cols[16]||"", tintumLabel:cols[17]||"",
          skalaKecerdasan:cols[18]||"",
          emosi:cols[19]||"", sosial:cols[20]||"", adaptasi:cols[21]||"",
          skalaPribadi:cols[22]||"", skalaPsiko:cols[23]||"", rekomendasi:cols[24]||"",
          bindoBenar:cols[25]||"", matBenar:cols[26]||"", ipaBenar:cols[27]||"", bingBenar:cols[28]||"",
          bindoNilai:cols[29]||"", matNilai:cols[30]||"", ipaNilai:cols[31]||"", bingNilai:cols[32]||"",
          rataAkademis:cols[33]||"",
          nilaiBaca:cols[34]||"", nilaiHafalan:cols[35]||"", totalQuran:cols[36]||"", ketQuran:cols[37]||"",
          inputIdBy:cols[38]||"", inputPsBy:cols[39]||"", inputAkBy:cols[40]||"", inputAqBy:cols[41]||"",
          type:"merged"
        };
        // Merge dengan data yang sudah ada
        if(existIdx>=0){
          // Update field yang tidak kosong saja
          Object.keys(row).forEach(k=>{
            if(row[k]&&row[k]!=="")raw[existIdx][k]=row[k];
          });
        } else {
          raw.push(row);
        }
        imported++;
      }
      saveLocal();
      showToast("✓ Import berhasil! "+imported+" data dimasukkan.","success");
      render();
    }catch(err){
      showToast("Gagal import: "+err.message,"error");
    }
  };
  reader.onerror=function(){
    showToast("Gagal membaca file!","error");
  };
  reader.readAsText(file,"UTF-8");
}

function showToast(msg,type="success"){toast={msg,type};render();setTimeout(()=>{toast=null;render()},4000)}
function doImportAwal(input){
  const file=input.files[0];
  if(!file){return;}
  input.value="";
  // Cek apakah file CSV atau Excel
  const isCSV=file.name.toLowerCase().endsWith('.csv');
  if(isCSV){
    // Baca sebagai CSV
    const reader=new FileReader();
    reader.onload=function(e){
      try{
        processImportAwalCSV(e.target.result);
      }catch(err){showToast("Gagal import: "+err.message,"error");}
    };
    reader.readAsText(file,"UTF-8");
  } else {
    // Baca sebagai Excel menggunakan SheetJS
    const reader=new FileReader();
    reader.onload=function(e){
      try{
        const data=new Uint8Array(e.target.result);
        const workbook=XLSX.read(data,{type:'array'});
        const sheetName=workbook.SheetNames[0];
        const sheet=workbook.Sheets[sheetName];
        const rows=XLSX.utils.sheet_to_json(sheet,{header:1,defval:""});
        processImportAwalRows(rows);
      }catch(err){showToast("Gagal baca Excel: "+err.message,"error");}
    };
    reader.readAsArrayBuffer(file);
  }
}
function processImportAwalCSV(csv){
  const lines=csv.trim().split("\n");
  const rows=lines.map(l=>{
    const cols=[];let cur="",inQ=false;
    for(const ch of l){
      if(ch==='"'){inQ=!inQ;}
      else if(ch===','&&!inQ){cols.push(cur.trim().replace(/^"|"$/g,""));cur="";}
      else{cur+=ch;}
    }
    cols.push(cur.trim().replace(/^"|"$/g,""));
    return cols;
  });
  processImportAwalRows(rows);
}
function processImportAwalRows(rows){
  if(!rows||rows.length<2){showToast("File kosong atau tidak valid!","error");return;}
  // Cari header row - cari baris yang ada "No. Pendaftaran"
  // Support baris header di mana saja (termasuk setelah baris judul)
  let headerIdx=-1;
  let colNop=-1,colNama=-1,colPanggil=-1,colJK=-1,colSekolah=-1,colTglLahir=-1,colKotaLahir=-1;
  for(let i=0;i<Math.min(10,rows.length);i++){
    if(!rows[i]||rows[i].every(c=>!c))continue;
    const row=rows[i].map(c=>String(c||"").toLowerCase().trim());
    const nopIdx=row.findIndex(c=>c.includes('pendaftaran'));
    const namaIdx=row.findIndex(c=>c.includes('nama calon')||c.includes('nama siswa')||(c.includes('nama')&&!c.includes('panggil')));
    if(nopIdx>=0&&namaIdx>=0){
      headerIdx=i;
      colNop=nopIdx;
      colNama=namaIdx;
      colPanggil=row.findIndex(c=>c.includes('panggilan'));
      colJK=row.findIndex(c=>c.includes('kelamin')||c==='jk'||c==='l/p');
      colSekolah=row.findIndex(c=>c.includes('sekolah'));
      colTglLahir=row.findIndex(c=>c.includes('tanggal lahir')||c.includes('tgl lahir')||c.includes('tgl. lahir'));
      colKotaLahir=row.findIndex(c=>c.includes('kota lahir')||c.includes('tempat lahir'));
      break;
    }
  }
  if(headerIdx<0){showToast("Format file tidak dikenali! Pastikan ada kolom No. Pendaftaran dan Nama.","error");return;}
  const tgl=gv("I-tgl")||"";
  const tahun=gv("I-tahun")||"";
  const status=gv("I-status")||"";
  let imported=0, skipped=0;
  const importedRows=[];
  for(let i=headerIdx+1;i<rows.length;i++){
    const row=rows[i];
    if(!row||row.every(c=>!c))continue;
    const nop=String(row[colNop]||"").trim();
    if(!nop||nop==="0"||nop==="")continue;
    // Cek apakah sudah ada
    const exist=raw.findIndex(r=>String(r.noPendaftaran).trim()===nop&&r.type==="identitas");
    if(exist>=0){skipped++;continue;}
    // Normalisasi JK
    let jk=colJK>=0?String(row[colJK]||"").trim():"";
    if(jk.toLowerCase()==="l"||jk.toLowerCase()==="laki-laki"||jk.toLowerCase()==="laki")jk="Laki-Laki";
    else if(jk.toLowerCase()==="p"||jk.toLowerCase()==="perempuan")jk="Perempuan";
    // Ambil tgl lahir - bisa berupa Date object, string, atau number (serial Excel)
    let tgllahir="";
    if(colTglLahir>=0&&row[colTglLahir]!==null&&row[colTglLahir]!==undefined&&row[colTglLahir]!==""){
      const rawTgl=row[colTglLahir];
      try{
        let d=null;
        if(typeof rawTgl==="number"){
          // Excel serial date number
          d=new Date(Math.round((rawTgl-25569)*86400*1000));
        } else if(rawTgl instanceof Date){
          d=rawTgl;
        } else if(typeof rawTgl==="string"&&rawTgl.trim()){
          const s=rawTgl.trim();
          if(/^\d{4}-\d{2}-\d{2}/.test(s)){
            // Format YYYY-MM-DD
            tgllahir=s.substring(0,10);
          } else if(/^\d{2}[\/\-]\d{2}[\/\-]\d{4}/.test(s)){
            // Format DD/MM/YYYY atau DD-MM-YYYY
            const parts=s.split(/[\/\-]/);
            tgllahir=parts[2]+"-"+parts[1].padStart(2,"0")+"-"+parts[0].padStart(2,"0");
          } else if(/^\d{2}[\/\-]\d{2}[\/\-]\d{2}$/.test(s)){
            // Format DD/MM/YY
            const parts=s.split(/[\/\-]/);
            const yr=parseInt(parts[2])<50?"20"+parts[2]:"19"+parts[2];
            tgllahir=yr+"-"+parts[1].padStart(2,"0")+"-"+parts[0].padStart(2,"0");
          } else {
            d=new Date(s);
          }
        }
        if(d&&!tgllahir){
          const y=d.getFullYear();
          const m=String(d.getMonth()+1).padStart(2,"0");
          const dd=String(d.getDate()).padStart(2,"0");
          if(y>1900&&y<2100)tgllahir=y+"-"+m+"-"+dd;
        }
      }catch(e){}
    }
    // Hitung usia otomatis jika ada tgl test dan tgl lahir
    let usia="";
    if(tgl&&tgllahir){
      try{
        const tTest=new Date(tgl);
        const tLahir=new Date(tgllahir);
        let th=tTest.getFullYear()-tLahir.getFullYear();
        let bl=tTest.getMonth()-tLahir.getMonth();
        if(tTest.getDate()<tLahir.getDate())bl--;
        if(bl<0){th--;bl+=12;}
        usia=th+" tahun "+bl+" bulan";
      }catch(e){}
    }
    const newRow={
      noPendaftaran:nop,
      nama:colNama>=0?String(row[colNama]||"").trim():"",
      panggil:colPanggil>=0?String(row[colPanggil]||"").trim():"",
      jk:jk,
      tgllahir:tgllahir,
      usia:usia,
      tgl:tgl,
      status:status,
      sekolah:colSekolah>=0?String(row[colSekolah]||"").trim():"",
      tahun:tahun,
      inputIdBy:cu?cu.name:"",
      type:"identitas"
    };
    raw.push(newRow);
    importedRows.push(newRow);
    imported++;
  }
  saveLocal();
  let msg="✓ Import berhasil! "+imported+" siswa dimasukkan.";
  if(skipped>0)msg+=" ("+skipped+" sudah ada, dilewati)";
  showToast(msg,"success");
  render();
  if(importedRows.length>0){
    syncImportAwalToSheets(importedRows);
  }
}
async function syncImportAwalToSheets(rowsToSync){
  showToast("Menyinkronkan "+rowsToSync.length+" siswa ke Google Sheets...","info");
  let ok=0,fail=0;
  for(const r of rowsToSync){
    try{
      await sendGS(r);
      await new Promise(res=>setTimeout(res,300));
      ok++;
    }catch(e){fail++;}
  }
  showToast("✓ Sync ke Sheets selesai! "+ok+" siswa tersimpan"+(fail>0?" ("+fail+" gagal)":"")+".","success");
}
function autoNopend(){
  // Ambil tahun dari field Tanggal Test, fallback ke tahun sekarang
  const tgl=gv("I-tgl");
  const tahun=tgl?new Date(tgl).getFullYear():new Date().getFullYear();
  // Cari No. Pendaftaran terakhir dengan format AH-YYYY-NNN di data yang ada
  const prefix="AH-"+tahun+"-";
  let maxNum=0;
  raw.forEach(r=>{
    const nop=String(r.noPendaftaran||"").trim();
    if(nop.startsWith(prefix)){
      const num=parseInt(nop.replace(prefix,""))||0;
      if(num>maxNum)maxNum=num;
    }
  });
  const next=String(maxNum+1).padStart(3,"0");
  const generated=prefix+next;
  document.getElementById("I-nopend").value=generated;
  showToast("No. Pendaftaran otomatis: "+generated,"success");
}
function hitungUsia(){
  const tgl=gv("I-tgl");
  const lahir=gv("I-tgllahir");
  if(!tgl||!lahir){sh("I-usia","");return;}
  const tTest=new Date(tgl);
  const tLahir=new Date(lahir);
  if(isNaN(tTest)||isNaN(tLahir)){sh("I-usia","");return;}
  let tahun=tTest.getFullYear()-tLahir.getFullYear();
  let bulan=tTest.getMonth()-tLahir.getMonth();
  if(tTest.getDate()<tLahir.getDate())bulan--;
  if(bulan<0){tahun--;bulan+=12;}
  const hasil=tahun+" tahun "+bulan+" bulan";
  document.getElementById("I-usia").value=hasil;
}

async function exportXLSX(fl){

  const WIDTHS = [14, 24, 16, 5, 12, 16, 12, 10, 22, 18, 9, 7, 7, 7, 7, 7, 7, 7, 9, 14, 20];

  const dataRows = fl.map((p,ri) => {

      const numFmt = isNoP ? 'mso-number-format:"@"' : '';
      return `<td style="background:${bg};${isNum?"text-align:center;":""}padding:3px 5px;border-bottom:1px solid #E2E8F0;font-size:9pt;vertical-align:middle;${numFmt}">${esc(v)}</td>`;
    }).join("");
    return `<tr>${cells}</tr>`;

  const colGroup = WIDTHS.map(w => `<col width="${w*7}">`).join("");

     Terpisah dari exportXLSX() asli (dipakai tombol Export CSV/Excel) - TIDAK mengubahnya. */
  const tahunVal = modalTahun;
  const tglVal   = modalTgl ? `Tanggal Pelaksanaan: ${fmtTgl(modalTgl)}` : "";
  const COLS = ["No. Pendaftaran","Nama Siswa","Nama Panggilan","JK","Tgl Lahir","Usia","Tgl Test","Status","Sekolah Asal","Tahun",
                "CFIT Raw","Kap. Kecerdasan","TINTUM S2","TINTUM S3","TINTUM S5","TINTUM S6",
                "Logmat Total","Logmat Skala","Tintum Total","Tintum Label","Skala Kecerdasan",
                "Emosi","Sosial","Adaptasi","Skala Pribadi","Sk. Psiko","Rek.",
                "B.Indo Benar","Mat Benar","IPA Benar","B.Ing Benar",
                "B.Indo Nilai","Mat Nilai","IPA Nilai","B.Ing Nilai","Rata\u00b2 Akademis",
                "Baca","Hafalan","Total Al Quran","Ket. Al Quran",
                "Input Id.","Input Psi.","Input Akd.","Input AlQ.","Update Terakhir"];
  const WIDTHS = [14,24,16,5,12,16,12,10,22,9,
                  9,18,8,8,8,8,
                  9,9,9,16,18,
                  7,7,7,12,9,7,
                  7,7,7,7,
                  7,7,7,7,9,
                  7,7,9,16,
                  14,14,14,14,18];

  const esc = s => String(s==null?"":s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

  const hdrCells = COLS.map((c,i) =>
    `<td width="${WIDTHS[i]*7}" style="background:#1A3C2E;color:#FFFFFF;font-weight:bold;font-size:8pt;text-align:center;vertical-align:middle;padding:4px 4px;border:1px solid #C8A84B;white-space:nowrap">${esc(c)}</td>`
  ).join("");

  const dataRows = fl.map((p,ri) => {
    const bg = ri%2===0 ? "#FFFFFF" : "#F8FAFC";
    const vals = [
      p.noPendaftaran||"",
      p.nama||"",
      p.panggil||"",
      p.jk||"",
      p.tgllahir||"",
      p.usia||"",
      p.tgl ? new Date(p.tgl).toLocaleDateString("id-ID",{day:"2-digit",month:"2-digit",year:"numeric"}) : "",
      p.status||"",
      p.sekolah||"",
      p.tahun||"",
      p.cfit||"",
      p.cfitHasil||"",
      p.s2||"", p.s3||"", p.s5||"", p.s6||"",
      p.logmatTotal||"", p.logmatSkala||"",
      p.tintumTotal||"", p.tintumLabel||"",
      p.skalaKecerdasan||"",
      p.emosi||"", p.sosial||"", p.adaptasi||"",
      p.skalaPribadi||"",
      p.skalaPsiko||"",
      p.rekomendasi||"",
      p.bindoBenar||"", p.matBenar||"", p.ipaBenar||"", p.bingBenar||"",
      p.bindoNilai||"", p.matNilai||"", p.ipaNilai||"", p.bingNilai||"",
      p.rataAkademis||"",
      p.nilaiBaca||"", p.nilaiHafalan||"", p.totalQuran||"",
      p.ketQuran||"",
      p.inputIdBy||"", p.inputPsBy||"", p.inputAkBy||"", p.inputAqBy||"",
      p.terakhirUpdate||""
    ];
    const cells = vals.map((v,ci) => {
      const isNum = (ci>=10&&ci<=27)||(ci===37);
      const isNoP = ci === 0;
      const numFmt = isNoP ? 'mso-number-format:"@"' : '';
      return `<td style="background:${bg};${isNum?"text-align:center;":""}padding:3px 4px;border-bottom:1px solid #E2E8F0;font-size:8pt;vertical-align:middle;${numFmt}">${esc(v)}</td>`;
    }).join("");
    return `<tr>${cells}</tr>`;
  }).join("");

  const colGroup = WIDTHS.map(w => `<col width="${w*7}">`).join("");

  const xls = `<html xmlns:o="urn:schemas-microsoft-com:office:office"
xmlns:x="urn:schemas-microsoft-com:office:excel"
xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="UTF-8">
<!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets>
<x:ExcelWorksheet><x:Name>Rekap SPMB Lengkap</x:Name>
<x:WorksheetOptions><x:DisplayGridlines/><x:Print><x:FitWidth/><x:Landscape/></x:Print></x:WorksheetOptions>
</x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->
<style>
  body{font-family:Calibri,Arial,sans-serif}
  td{font-size:8pt;vertical-align:middle}
  .title{font-size:14pt;font-weight:bold;color:#1A3C2E;text-align:center;vertical-align:middle;padding:6px}
  .tahun{font-size:11pt;font-weight:bold;color:#C8A84B;text-align:center;vertical-align:middle;padding:4px}
  .tgl{font-size:10pt;color:#555555;text-align:center;vertical-align:middle;padding:3px}
</style></head>
<body>
<table border="0" cellspacing="0" cellpadding="0" style="border-collapse:collapse;width:100%">
  <colgroup>${colGroup}</colgroup>
  <tr height="40">
    <td colspan="${COLS.length}" style="background:#1A3C2E;color:#FFFFFF;font-size:15pt;font-weight:bold;text-align:center;vertical-align:middle;padding:8px;letter-spacing:1px">SPMB SMP AL HIKMAH SURABAYA</td>
  </tr>
  <tr height="22">
    <td colspan="${COLS.length}" style="background:#1A3C2E;color:#C8A84B;font-size:11pt;font-weight:bold;text-align:center;vertical-align:middle;padding:4px">Tahun Ajaran ${tahunVal}</td>
  </tr>
  <tr height="18">
    <td colspan="${COLS.length}" style="background:#1A3C2E;color:#CCCCCC;font-size:9pt;text-align:center;vertical-align:middle;padding:3px">${tglVal}</td>
  </tr>
  <tr height="6"><td colspan="${COLS.length}" style="border:none;background:#ffffff"></td></tr>
  <tr height="26">
    ${hdrCells}
  </tr>
  ${dataRows}
</table>
</body></html>`;

  const blob = new Blob(["\uFEFF"+xls], {type:"application/vnd.ms-excel;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `Rekap_SPMB_AlHikmah_Lengkap_${modalTahun.replace("/","_")}.xls`;
  a.click();
}

render();
</script>
</body>
</html>
